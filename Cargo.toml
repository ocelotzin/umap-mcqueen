[package]
name    = "umap-mcqueen"
version = "0.1.0"
edition = "2024"

[dependencies]
fast-umap  = "1.6.0"
burn       = { version = "0.20.1", features = ["wgpu", "autodiff", "autotune"] }
cubecl     = { version = "0.9.0",  features = ["wgpu"] }
csv        = "1.1"
textplots  = "0.8"
clump      = "0.5.8"
# serde, serde_json y sha2 ya venian en Cargo.lock como dependencias transitivas
# de burn: declararlas aqui no anade compilacion ni superficie nueva, solo las
# promueve a directas para poder usarlas en el manifiesto del modelo.
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2       = "0.10"
