[package]
name    = "umap-mcqueen"
version = "0.1.0"
edition = "2024"

[dependencies]
fast-umap  = "1.6.0"
burn       = { version = "0.20.1", features = ["wgpu", "autodiff", "autotune"] }
cubecl     = { version = "0.9.0",  features = ["wgpu"] }
csv        = "1.1"
textplots  = "0.8"
clump      = "0.5.8"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2       = "0.10"
rand       = "0.8"
rand_distr = "0.4"

# fast-umap 1.6.0 no deja fijar la semilla de sus generadores (solo siembra el
# backend), así que dos entrenamientos iguales dan modelos distintos. Hasta que
# upstream publique una versión con `UmapConfig::seed`, se compila el fork de
# josemal98 (su rama `seed-config`, propuesta a upstream como PR). CUÁNDO SE
# RETIRA: el día que crates.io traiga fast-umap con semilla configurable, se borra
# este bloque, se sube la versión de arriba y se archiva el fork. Ver README.
[patch.crates-io]
fast-umap = { git = "https://github.com/josemal98/fast-umap", rev = "15dc6c5251cb7aecec4fe59d23ede30f0ac37e2b" }

