[package]
name    = "umap-mcqueen"
version = "0.1.0"
edition = "2024"

[dependencies]
fast-umap  = "1.6.0"
burn       = { version = "0.20.1", features = ["wgpu", "autodiff", "autotune"] }
cubecl     = { version = "0.9.0",  features = ["wgpu"] }
csv        = "1.1"
textplots  = "0.8"
clump      = "0.5.8"
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2       = "0.10"
rand       = "0.8"
rand_distr = "0.4"

